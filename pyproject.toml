[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "bspu-profcom-bot-hayeu"
version = "0.2.2"
authors = [{ name = "Aliaksei Haeyu", email = "ggaev.alex.work@gmail.com" }]
description = "A telegram bot for BSPU's organisation"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "aiosqlite~=0.22.1",
    "bcrypt~=5.0",
    "python-telegram-bot~=22.7",
    "dotenv~=0.9.9",
]

[project.urls]
Homepage = "https://github.com/Alexii01/bspu-profcom-bot"
Issues = "https://github.com/Alexii01/bspu-profcom-bot/issues"
